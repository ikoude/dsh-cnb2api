<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img"
     aria-label="A plugin page showing four account rows in a status panel beside a gateway card listing three endpoints, with one account highlighted as active and carrying a progress bar">
  <!-- Text-free illustration: it must read in both light and dark themes, so every
       colour is a mid-tone stroke or a low-opacity fill that blends with either surface. -->

  <!-- panel card -->
  <g fill="none" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="1.2">
    <rect x="32" y="32" width="330" height="236" rx="10"/>
  </g>

  <!-- panel header: title bar, refresh ring, close cross -->
  <g fill="#94a3b8" fill-opacity="0.55">
    <rect x="48" y="52" width="84" height="8" rx="4"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round">
    <circle cx="316" cy="56" r="5"/>
    <path d="M312 56a4 4 0 0 1 6.5-3"/>
    <path d="M334 52l8 8M342 52l-8 8"/>
  </g>

  <!-- row A: exhausted account, dimmed -->
  <g>
    <circle cx="56" cy="92" r="4" fill="#94a3b8" fill-opacity="0.45"/>
    <rect x="70" y="88" width="92" height="8" rx="4" fill="#94a3b8" fill-opacity="0.28"/>
    <rect x="300" y="85" width="40" height="14" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="48" y1="110" x2="346" y2="110" stroke="#94a3b8" stroke-opacity="0.22" stroke-width="1"/>
  </g>

  <!-- row B: the active account, full strength, with a consumption bar -->
  <g>
    <circle cx="56" cy="133" r="4.5" fill="#22c55e"/>
    <rect x="70" y="129" width="104" height="8" rx="4" fill="#94a3b8" fill-opacity="0.6"/>
    <rect x="290" y="126" width="48" height="14" rx="4" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.75" stroke-width="1"/>
    <rect x="48" y="150" width="200" height="4" rx="2" fill="#94a3b8" fill-opacity="0.22"/>
    <rect x="48" y="150" width="132" height="4" rx="2" fill="#3b82f6"/>
    <line x1="48" y1="168" x2="346" y2="168" stroke="#94a3b8" stroke-opacity="0.22" stroke-width="1"/>
  </g>

  <!-- row C: another exhausted account -->
  <g>
    <circle cx="56" cy="193" r="4" fill="#94a3b8" fill-opacity="0.45"/>
    <rect x="70" y="189" width="86" height="8" rx="4" fill="#94a3b8" fill-opacity="0.28"/>
    <rect x="300" y="186" width="40" height="14" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1"/>
  </g>

  <!-- panel footer button -->
  <rect x="48" y="222" width="298" height="20" rx="6" fill="none" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.2"/>

  <!-- connector: the gateway feeds the panel -->
  <g stroke="#94a3b8" stroke-opacity="0.5" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M390 104h-18"/>
    <path d="M378 100l-8 4 8 4"/>
  </g>

  <!-- gateway card -->
  <g fill="none" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="1.2">
    <rect x="398" y="32" width="210" height="236" rx="10"/>
  </g>

  <!-- gateway header -->
  <rect x="414" y="52" width="46" height="8" rx="4" fill="#94a3b8" fill-opacity="0.55"/>

  <!-- endpoint rows: label, code text, copy button -->
  <g>
    <rect x="414" y="86" width="32" height="7" rx="3.5" fill="#94a3b8" fill-opacity="0.4"/>
    <rect x="452" y="84" width="104" height="9" rx="3" fill="#94a3b8" fill-opacity="0.3"/>
    <rect x="564" y="82" width="28" height="14" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1"/>
  </g>
  <g>
    <rect x="414" y="124" width="32" height="7" rx="3.5" fill="#94a3b8" fill-opacity="0.4"/>
    <rect x="452" y="122" width="92" height="9" rx="3" fill="#94a3b8" fill-opacity="0.3"/>
    <rect x="564" y="120" width="28" height="14" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1"/>
  </g>
  <g>
    <rect x="414" y="162" width="32" height="7" rx="3.5" fill="#94a3b8" fill-opacity="0.4"/>
    <rect x="452" y="160" width="76" height="9" rx="3" fill="#94a3b8" fill-opacity="0.3"/>
    <rect x="536" y="158" width="28" height="14" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1"/>
    <rect x="570" y="158" width="22" height="14" rx="4" fill="none" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1"/>
  </g>

  <!-- published state: green dot + short caption bar -->
  <circle cx="418" cy="208" r="4" fill="#22c55e"/>
  <rect x="430" y="204" width="98" height="8" rx="4" fill="#22c55e" fill-opacity="0.35"/>
  <rect x="414" y="228" width="120" height="7" rx="3.5" fill="#94a3b8" fill-opacity="0.28"/>
</svg>
