<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" role="img" aria-label="CNB2API">
  <!-- A gateway node whose address moves: one solid arc arrives, one dashed arc
       leaves. The arrowhead points at the node, so the reading is "followed",
       not "replaced". -->
  <g fill="none" stroke="#185fa5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 18A8.5 8.5 0 0 1 18 9.5"/>
    <path d="M18 26.5A8.5 8.5 0 0 0 26.5 18" stroke-dasharray="2.4 3.4"/>
  </g>
  <rect x="13.4" y="13.4" width="9.2" height="9.2" rx="2.4" fill="#185fa5"/>
  <circle cx="18" cy="18" r="1.8" fill="#ffffff"/>
</svg>
